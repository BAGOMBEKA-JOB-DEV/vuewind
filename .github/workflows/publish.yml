name: Publish Vuewind

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version in package.json
        required: true
        default: "1.0.1"
        type: string
      publish:
        description: Publish directly to npm and create the GitHub release
        required: true
        default: false
        type: boolean
      stage:
        description: Stage on npm for account approval with 2FA (keep publish off)
        required: true
        default: false
        type: boolean

concurrency:
  group: vuewind-npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PUBLISH_REQUESTED: ${{ inputs.publish }}
      STAGE_REQUESTED: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Validate release version and destination
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.name !== '@bagombeka/vuewind' || pkg.private || pkg.version !== process.env.RELEASE_VERSION) {
            throw new Error('The requested version must match the public @bagombeka/vuewind package.json version.');
          }
          if (!fs.existsSync(`docs/releases/${pkg.version}.md`)) {
            throw new Error('Add version-specific release notes before running the release workflow.');
          }
          if (process.env.PUBLISH_REQUESTED === 'true' && process.env.STAGE_REQUESTED === 'true') {
            throw new Error('Choose either direct publication or staged publication, not both.');
          }
          if ((process.env.PUBLISH_REQUESTED === 'true' || process.env.STAGE_REQUESTED === 'true') &&
              (process.env.GITHUB_REF !== 'refs/heads/main' || process.env.GITHUB_REPOSITORY !== 'BAGOMBEKA-JOB-DEV/vuewind')) {
            throw new Error('Publish from the main branch of BAGOMBEKA-JOB-DEV/vuewind after merging the release PR.');
          }
          NODE
      - name: Install npm with staged publishing support
        if: inputs.stage
        run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts
      - run: npm run audit
      - run: npm run lint
      - name: Validate the release and packed consumer
        run: npm run release:check
      - name: Build documentation
        run: npm run build:docs
      - name: Pack the verified package
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts
      - name: Preview publication
        run: npm publish "./artifacts/bagombeka-vuewind-${RELEASE_VERSION}.tgz" --dry-run --ignore-scripts --access public
      - uses: actions/upload-artifact@v6
        with:
          name: bagombeka-vuewind-${{ inputs.version }}
          path: artifacts/*.tgz
          if-no-files-found: error
      - name: Stage on npm for account approval
        if: inputs.stage
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Add a write-enabled npm token as the repository Actions secret NPM_TOKEN."
            exit 1
          fi
          npm stage publish "./artifacts/bagombeka-vuewind-${RELEASE_VERSION}.tgz" --ignore-scripts --access public --tag latest --provenance --json > artifacts/staged-release.json
          cat artifacts/staged-release.json
          echo "Staged @bagombeka/vuewind@${RELEASE_VERSION}. Approve the package on npm with your account's 2FA to make it publicly installable." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: inputs.stage
        with:
          name: bagombeka-vuewind-${{ inputs.version }}-staging
          path: artifacts/staged-release.json
          if-no-files-found: error
      - name: Publish to npm (manual opt-in)
        if: inputs.publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Add an npm publish token as the repository Actions secret NPM_TOKEN before the first release."
            exit 1
          fi
          npm publish "./artifacts/bagombeka-vuewind-${RELEASE_VERSION}.tgz" --ignore-scripts --access public --tag latest --provenance
      - name: Wait for the public npm package
        if: inputs.publish
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const archive = fs.readFileSync(`artifacts/bagombeka-vuewind-${process.env.RELEASE_VERSION}.tgz`);
          const integrity = bytes => `sha512-${createHash('sha512').update(bytes).digest('base64')}`;
          const expected = integrity(archive);
          const deadline = Date.now() + 15 * 60 * 1000;
          while (Date.now() < deadline) {
            try {
              const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg.name)}`, {
                cache: 'no-store', signal: AbortSignal.timeout(15000),
              });
              if (response.ok) {
                const metadata = await response.json();
                const version = metadata.versions?.[pkg.version];
                if (version?.name === pkg.name && metadata['dist-tags']?.latest === pkg.version &&
                    version.dist?.integrity === expected) {
                  const tarball = await fetch(version.dist.tarball, {
                    cache: 'no-store', signal: AbortSignal.timeout(15000),
                  });
                  if (tarball.ok && integrity(Buffer.from(await tarball.arrayBuffer())) === expected) {
                    console.log(`Verified public ${pkg.name}@${pkg.version}, latest tag, and matching downloadable tarball.`);
                    process.exit(0);
                  }
                }
              }
            } catch (error) {
              console.log(`Registry check: ${error.message}`);
            }
            console.log('Waiting for npm processing and public registry availability.');
            await new Promise(resolve => setTimeout(resolve, 20000));
          }
          throw new Error('npm accepted the upload, but public availability was not verified within 15 minutes. Check the registry before retrying; do not republish an accepted version.');
          NODE
      - name: Create the GitHub release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v${RELEASE_VERSION}" "./artifacts/bagombeka-vuewind-${RELEASE_VERSION}.tgz" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "v${RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease=false --latest \
              --title "Vuewind ${RELEASE_VERSION}" --notes-file "docs/releases/${RELEASE_VERSION}.md"
          else
            gh release create "v${RELEASE_VERSION}" "./artifacts/bagombeka-vuewind-${RELEASE_VERSION}.tgz" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Vuewind ${RELEASE_VERSION}" --notes-file "docs/releases/${RELEASE_VERSION}.md"
          fi
